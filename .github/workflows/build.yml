name: Build Android APK

on:
  push:
    branches: [ "main", "ana", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu Cek
        uses: actions/checkout@v4

      - name: ZIP Cikar
        run: |
          if [ -f "DinleAI-NewLogo-VIP.zip" ]; then
            unzip -o DinleAI-NewLogo-VIP.zip -d .
          elif [ -f "DinleAI-Android-Fixed.zip" ]; then
            unzip -o DinleAI-Android-Fixed.zip -d .
          fi

      - name: Node.js Kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ortam Degiskenlerini (.env) Olustur
        run: |
          TARGET_DIR=$(find . -maxdepth 2 -type d -name "dinlefix" | head -n 1)
          if [ -z "$TARGET_DIR" ]; then TARGET_DIR="."; fi
          cd "$TARGET_DIR"
          cat << EOF > .env
          LIVEAVATAR_API_KEY=${{ secrets.LIVEAVATAR_API_KEY }}
          LIVEAVATAR_AVATAR_ID=${{ secrets.LIVEAVATAR_AVATAR_ID }}
          LIVEAVATAR_CONTEXT_ID=${{ secrets.LIVEAVATAR_CONTEXT_ID }}
          EOF

      - name: Bagimliliklari Yukle
        run: |
          TARGET_DIR=$(find . -maxdepth 2 -type d -name "dinlefix" | head -n 1)
          if [ -z "$TARGET_DIR" ]; then TARGET_DIR="."; fi
          cd "$TARGET_DIR"
          npm install --legacy-peer-deps

      - name: Web Uygulamasini Derle
        run: |
          TARGET_DIR=$(find . -maxdepth 2 -type d -name "dinlefix" | head -n 1)
          if [ -z "$TARGET_DIR" ]; then TARGET_DIR="."; fi
          cd "$TARGET_DIR"
          npm run build

      - name: Java Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Android Klasorunu Hazirla ve APK Derle
        run: |
          TARGET_DIR=$(find . -maxdepth 2 -type d -name "dinlefix" | head -n 1)
          if [ -z "$TARGET_DIR" ]; then TARGET_DIR="."; fi
          cd "$TARGET_DIR"

          # Android platformu yoksa ekle ve senkronize et
          if [ ! -d "android" ]; then
            npx cap add android || true
          fi
          npx cap sync android || true

          cd android
          chmod +x gradlew || true
          ./gradlew assembleDebug --stacktrace

      - name: APK Dosyasini Yukle
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/outputs/apk/debug/app-debug.apk'
          overwrite: true
          
