name: Dinle AI APK Oluştur

on:
  workflow_dispatch:
  push:
    branches:
      - ana

permissions:
  contents: read

jobs:
  build:
    name: APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. PROJEYİ AL
      # ============================================================
      - name: Depoyu indir
        uses: actions/checkout@v5


      # ============================================================
      # 2. JAVA 17
      # ============================================================
      - name: Java 17 kurulumu
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle


      # ============================================================
      # 3. NODE.JS
      # ============================================================
      - name: Node.js kurulumu
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            extracted/dinlefix/package-lock.json


      # ============================================================
      # 4. ZIP / PROJE YAPISINI KONTROL ET
      # ============================================================
      - name: Proje klasörlerini bul
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "PROJE KLASÖRLERİ"
          echo "======================================"

          echo "Ana dizin:"
          pwd

          echo ""
          echo "Dosyalar:"
          find . -maxdepth 4 -type f \
            \( -name "package.json" -o -name "settings.gradle" -o -name "build.gradle" -o -name "gradlew" \) \
            | sort

          echo ""
          echo "======================================"
          echo "ANDROID PROJESİ ARANIYOR"
          echo "======================================"

          ANDROID_DIR=""

          if [ -d "extracted/dinlefix/android" ]; then
            ANDROID_DIR="extracted/dinlefix/android"
          elif [ -d "android" ]; then
            ANDROID_DIR="android"
          else
            FOUND_ANDROID=$(find . -type f -name "settings.gradle" -o -type f -name "settings.gradle.kts" \
              | head -n 1 || true)

            if [ -n "$FOUND_ANDROID" ]; then
              ANDROID_DIR=$(dirname "$FOUND_ANDROID")
            fi
          fi

          if [ -z "$ANDROID_DIR" ]; then
            echo "HATA: Android Gradle projesi bulunamadı."
            exit 1
          fi

          echo "Android klasörü:"
          echo "$ANDROID_DIR"

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"


      # ============================================================
      # 5. WEB PROJESİ
      # ============================================================
      - name: Web bağımlılıklarını kur
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "WEB BAĞIMLILIKLARI"
          echo "======================================"

          if [ -f "package.json" ]; then
            npm install
          elif [ -f "extracted/dinlefix/package.json" ]; then
            cd extracted/dinlefix
            npm install
          else
            echo "package.json bulunamadı."
            exit 1
          fi


      # ============================================================
      # 6. WEB BUILD
      # ============================================================
      - name: Web uygulamasını derle
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "WEB BUILD"
          echo "======================================"

          if [ -f "package.json" ]; then
            npm run build
            WEB_DIST="dist"
          elif [ -f "extracted/dinlefix/package.json" ]; then
            cd extracted/dinlefix
            npm run build
            WEB_DIST="dist"
          else
            echo "Web projesi bulunamadı."
            exit 1
          fi

          echo "Web build başarılı."


      # ============================================================
      # 7. WEB DOSYALARINI ANDROID ASSETS'E KOPYALA
      # ============================================================
      - name: Web dosyalarını Android'e aktar
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "ANDROID ASSETS"
          echo "======================================"

          if [ -d "dist" ]; then
            WEB_DIST="dist"
          else
            WEB_DIST="extracted/dinlefix/dist"
          fi

          ASSETS_DIR="$ANDROID_DIR/app/src/main/assets"

          echo "Web:"
          echo "$WEB_DIST"

          echo "Android assets:"
          echo "$ASSETS_DIR"

          mkdir -p "$ASSETS_DIR"

          rm -rf "$ASSETS_DIR"/*

          cp -r "$WEB_DIST"/* "$ASSETS_DIR"/

          echo ""
          echo "Assets aktarımı tamamlandı."

          find "$ASSETS_DIR" -maxdepth 2 -type f | head -50


      # ============================================================
      # 8. GRADLE WRAPPER YOKSA OLUŞTUR
      # ============================================================
      - name: Gradle Wrapper hazırla
        shell: bash
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          set -e

          echo "======================================"
          echo "GRADLE WRAPPER"
          echo "======================================"

          if [ -f "./gradlew" ]; then
            echo "gradlew zaten mevcut."
          else
            echo "gradlew bulunamadı."
            echo "Gradle Wrapper oluşturuluyor..."

            gradle wrapper --gradle-version 8.9

            echo "Gradle Wrapper oluşturuldu."
          fi

          chmod +x ./gradlew

          ./gradlew --version


      # ============================================================
      # 9. KOTLIN SÜRÜM ÇAKIŞMASINI ÖNLE
      # ============================================================
      - name: Kotlin bağımlılıklarını düzelt
        shell: bash
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          set -e

          echo "======================================"
          echo "KOTLIN BAĞIMLILIK DÜZELTMESİ"
          echo "======================================"

          cat > kotlin-fix.gradle <<'EOF'
          allprojects {
              configurations.configureEach {
                  resolutionStrategy.eachDependency { details ->
                      if (details.requested.group == "org.jetbrains.kotlin") {
                          details.useVersion("1.8.22")
                          details.because("Dinle AI Kotlin bağımlılıklarını aynı sürümde tut")
                      }
                  }
              }
          }
          EOF

          echo "Kotlin çözümleme kuralı oluşturuldu."


      # ============================================================
      # 10. TEMİZLE
      # ============================================================
      - name: Gradle temizle
        shell: bash
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          set -e

          echo "======================================"
          echo "GRADLE CLEAN"
          echo "======================================"

          ./gradlew clean \
            --init-script kotlin-fix.gradle \
            --no-daemon


      # ============================================================
      # 11. APK DERLE
      # ============================================================
      - name: APK oluştur
        shell: bash
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          set -e

          echo "======================================"
          echo "DINLE AI APK DERLEME"
          echo "======================================"

          echo "Android klasörü:"
          pwd

          echo ""
          echo "Gradle:"
          ./gradlew --version

          echo ""
          echo "APK derleniyor..."

          ./gradlew assembleDebug \
            --init-script kotlin-fix.gradle \
            --no-daemon \
            --stacktrace

          echo ""
          echo "======================================"
          echo "APK BAŞARIYLA OLUŞTURULDU"
          echo "======================================"

          find app/build/outputs/apk -type f -name "*.apk" -print


      # ============================================================
      # 12. APK'YI ARTIFACT OLARAK YÜKLE
      # ============================================================
      - name: APK yükle
        uses: actions/upload-artifact@v4
        with:
          name: DinleAI-APK
          path: |
            ${{ env.ANDROID_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error


      # ============================================================
      # 13. APK KONTROL
      # ============================================================
      - name: APK kontrol
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "APK DOSYASI"
          echo "======================================"

          find "$ANDROID_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            -exec ls -lh {} \;

          echo ""
          echo "APK oluşturma işlemi tamamlandı."
