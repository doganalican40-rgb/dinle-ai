name: Dinle AI APK'sını oluşturun

on:
  push:
    branches:
      - ana
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: APK oluştur
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. KODU AL
      # ==========================================
      - name: Kodu al
        uses: actions/checkout@v4

      # ==========================================
      # 2. JAVA 17
      # ==========================================
      - name: Java 17 kur
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ==========================================
      # 3. NODE 20
      # ==========================================
      - name: Node.js 20 kur
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
        continue-on-error: true

      # ==========================================
      # 4. PROJE KLASÖRÜNÜ BUL
      # ==========================================
      - name: Proje klasörünü bul
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "PROJE KLASÖRÜ ARANIYOR"
          echo "======================================"

          if [ -f "package.json" ]; then
            PROJECT_DIR="."
          elif [ -f "dinlefix/package.json" ]; then
            PROJECT_DIR="dinlefix"
          elif [ -f "android/app/build.gradle" ]; then
            PROJECT_DIR="."
          elif [ -f "dinlefix/android/app/build.gradle" ]; then
            PROJECT_DIR="dinlefix"
          else
            PROJECT_DIR=$(find . -name package.json -not -path "*/node_modules/*" | head -1 | xargs dirname || true)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "HATA: Proje klasörü bulunamadı."
            exit 1
          fi

          echo "Bulunan proje: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # ==========================================
      # 5. NPM
      # ==========================================
      - name: NPM bağımlılıklarını kur
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Node:"
          node --version

          echo "NPM:"
          npm --version

          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "package-lock.json bulunamadı."
            npm install
          fi

      # ==========================================
      # 6. WEB BUILD
      # ==========================================
      - name: Web uygulamasını derle
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "WEB BUILD"
          echo "======================================"

          npm run build

          echo "Web build başarılı."

      # ==========================================
      # 7. GRADLE WRAPPER
      # ==========================================
      - name: Gradle wrapper hazırla
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR/android"

          if [ ! -f gradlew ]; then
            echo "gradlew bulunamadı."
            gradle wrapper --gradle-version 8.9
          fi

          chmod +x gradlew

      # ==========================================
      # 8. KOTLIN ÇAKIŞMASINI DÜZELT
      # ==========================================
      - name: Kotlin bağımlılıklarını düzelt
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR/android"

          echo "======================================"
          echo "KOTLIN BAĞIMLILIKLARI DÜZELTİLİYOR"
          echo "======================================"

          cat > kotlin-fix.gradle <<'EOF'
          allprojects {
              configurations.configureEach {
                  resolutionStrategy.eachDependency { details ->
                      if (details.requested.group == "org.jetbrains.kotlin") {
                          details.useVersion("1.8.22")
                          details.because("Kotlin bağımlılıkları tek sürümde birleştiriliyor")
                      }
                  }

                  exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
                  exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"
              }
          }
          EOF

          echo "Kotlin fix hazırlandı."

      # ==========================================
      # 9. APK DERLE
      # ==========================================
      - name: Android APK Derle
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR/android"

          echo "======================================"
          echo "DINLE AI APK DERLEME"
          echo "======================================"

          ./gradlew clean

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --init-script kotlin-fix.gradle

      # ==========================================
      # 10. APK KONTROL
      # ==========================================
      - name: APK kontrol
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR/android"

          echo "======================================"
          echo "APK DOSYALARI"
          echo "======================================"

          find . -type f -name "*.apk" -print

          APK=$(find . -type f -name "*.apk" | head -1)

          if [ -z "$APK" ]; then
            echo "HATA: APK oluşturulamadı."
            exit 1
          fi

          echo "APK bulundu:"
          echo "$APK"

      # ==========================================
      # 11. APK YÜKLE
      # ==========================================
      - name: APK yükle
        uses: actions/upload-artifact@v4
        with:
          name: DinleAI-Debug-APK
          path: |
            ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # ==========================================
      # 12. BAŞARILI
      # ==========================================
      - name: Başarılı
        shell: bash
        run: |
          echo "======================================"
          echo "DINLE AI APK BAŞARIYLA OLUŞTURULDU"
          echo "======================================"
