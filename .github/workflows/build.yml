name: Build Android APK

on:
  push:
    branches:
      - main
      - ana
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu Cek
        uses: actions/checkout@v4

      - name: ZIP Cikar
        shell: bash
        run: |
          set -e

          if [ -f "DinleAI-NewLogo-VIP.zip" ]; then
            echo "DinleAI-NewLogo-VIP.zip bulundu"
            unzip -o "DinleAI-NewLogo-VIP.zip" -d .
          elif [ -f "DinleAI-Android-Fixed.zip" ]; then
            echo "DinleAI-Android-Fixed.zip bulundu"
            unzip -o "DinleAI-Android-Fixed.zip" -d .
          fi

      - name: Proje Klasorunu Bul
        shell: bash
        run: |
          TARGET_DIR=$(find . -maxdepth 3 -type f -name "package.json" \
            -not -path "./node_modules/*" \
            -exec dirname {} \; | head -n 1)

          if [ -z "$TARGET_DIR" ]; then
            echo "package.json bulunamadi!"
            exit 1
          fi

          echo "TARGET_DIR=$TARGET_DIR" >> "$GITHUB_ENV"
          echo "Proje klasoru: $TARGET_DIR"

      - name: Node.js Kur
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ env.TARGET_DIR }}/package-lock.json

      - name: Java 17 Kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Node Bagimliliklarini Yukle
        working-directory: ${{ env.TARGET_DIR }}
        run: |
          set -e

          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      - name: Ortam Degiskenlerini Olustur
        working-directory: ${{ env.TARGET_DIR }}
        run: |
          cat > .env << EOF
          LIVEAVATAR_API_KEY=${{ secrets.LIVEAVATAR_API_KEY }}
          LIVEAVATAR_AVATAR_ID=${{ secrets.LIVEAVATAR_AVATAR_ID }}
          LIVEAVATAR_CONTEXT_ID=${{ secrets.LIVEAVATAR_CONTEXT_ID }}
          EOF

      - name: Capacitor Config Olustur
        working-directory: ${{ env.TARGET_DIR }}
        run: |
          rm -f capacitor.config.ts

          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.dinle.ai",
            "appName": "Dinle AI",
            "webDir": "dist"
          }
          EOF

      - name: Web Uygulamasini Derle
        working-directory: ${{ env.TARGET_DIR }}
        run: |
          set -e
          npm run build

      - name: Capacitor Android Hazirla
        working-directory: ${{ env.TARGET_DIR }}
        run: |
          set -e

          if [ ! -d "android" ]; then
            echo "Android klasoru yok, Capacitor Android ekleniyor..."
            npx cap add android
          else
            echo "Android klasoru zaten mevcut."
          fi

          npx cap sync android

      - name: Gradle Kurulumu
        uses: gradle/actions/setup-gradle@v4

      - name: Gradle Wrapper Kontrolu
        working-directory: ${{ env.TARGET_DIR }}/android
        shell: bash
        run: |
          set -e

          if [ ! -f "./gradlew" ]; then
            echo "gradlew bulunamadi."
            echo "Gradle wrapper olusturuluyor..."

            gradle wrapper --gradle-version 8.7

            chmod +x gradlew
          else
            echo "Mevcut gradlew kullanilacak."
            chmod +x gradlew
          fi

          ./gradlew --version

      - name: Android APK Derle
        working-directory: ${{ env.TARGET_DIR }}/android
        shell: bash
        run: |
          set -e

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: APK Dosyasini Bul
        shell: bash
        run: |
          echo "APK dosyalari:"
          find . -type f -name "*.apk" -print

      - name: APK Dosyasini Yukle
        uses: actions/upload-artifact@v4
        with:
          name: DinleAI-APK
          path: |
            ${{ env.TARGET_DIR }}/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          overwrite: true
