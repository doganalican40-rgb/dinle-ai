      - name: Proje Konfigürasyonu ve Web Derleme
        shell: bash
        run: |
          set -e
          
          P_DIR=$(find . -maxdepth 2 -type d -name "dinlefix" | head -n 1)
          if [ -z "$P_DIR" ]; then P_DIR="."; fi
          cd "$P_DIR"
          
          echo "LIVEAVATAR_API_KEY=${{ secrets.LIVEAVATAR_API_KEY }}" > .env
          echo "LIVEAVATAR_AVATAR_ID=${{ secrets.LIVEAVATAR_AVATAR_ID }}" >> .env
          echo "LIVEAVATAR_CONTEXT_ID=${{ secrets.LIVEAVATAR_CONTEXT_ID }}" >> .env

          rm -f capacitor.config.ts
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.dinle.ai",
            "appName": "Dinle AI",
            "webDir": "dist"
          }
          EOF

          rm -rf node_modules package-lock.json
          npm cache clean --force
          
          # 1. Normal paketleri kur
          npm install --legacy-peer-deps
          
          # 2. HATA ÇÖZÜMÜ: Linux için esbuild çekirdeğini zorla indir
          npm install esbuild-linux-64 @esbuild/linux-x64 --no-save
          
          # 3. Derlemeyi başlat
          NODE_OPTIONS=--max_old_space_size=4096 npm run build

          if [ -d "dist" ] && [ ! -d "www" ]; then cp -r dist www; fi
          
          npx cap add android || true
          npx cap sync android
          
