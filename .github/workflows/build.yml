name: Build Android APK

on:
  push:
    branches: [ "main", "ana", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu Cek
        uses: actions/checkout@v4

      - name: ZIP Cikar
        run: |
          if [ -f "DinleAI-NewLogo-VIP.zip" ]; then
            unzip -o DinleAI-NewLogo-VIP.zip -d .
          elif [ -f "DinleAI-Android-Fixed.zip" ]; then
            unzip -o DinleAI-Android-Fixed.zip -d .
          fi

      - name: Node.js Kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ortam Degiskenlerini (.env) Olustur
        run: |
          TARGET_DIR=$(find . -maxdepth 2 -type d -name "dinlefix" | head -n 1)
          if [ -z "$TARGET_DIR" ]; then TARGET_DIR="."; fi
          cd "$TARGET_DIR"
          cat << EOF > .env
          LIVEAVATAR_API_KEY=${{ secrets.LIVEAVATAR_API_KEY }}
          LIVEAVATAR_AVATAR_ID=${{ secrets.LIVEAVATAR_AVATAR_ID }}
          LIVEAVATAR_CONTEXT_ID=${{ secrets.LIVEAVATAR_CONTEXT_ID }}
          EOF

      - name: Bagimliliklari Yukle ve TypeScript Düzeltmesi
        run: |
          TARGET_DIR=$(find . -maxdepth 2 -type d -name "dinlefix" | head -n 1)
          if [ -z "$TARGET_DIR" ]; then TARGET_DIR="."; fi
          cd "$TARGET_DIR"
          npm install --legacy-peer-deps
          npm install -D typescript || true

      - name: Web Uygulamasini Derle
        run: |
          TARGET_DIR=$(find . -maxdepth 2 -type d -name "dinlefix" | head -n 1)
          if [ -z "$TARGET_DIR" ]; then TARGET_DIR="."; fi
          cd "$TARGET_DIR"
          
          rm -f capacitor.config.ts
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.dinle.ai",
            "appName": "Dinle AI",
            "webDir": "dist"
          }
          EOF
          
          npm run build

      - name: Java Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Android Klasorunu Hazirla ve Gradle 8.7 Ayarla
        run: |
          TARGET_DIR=$(find . -maxdepth 2 -type d -name "dinlefix" | head -n 1)
          if [ -z "$TARGET_DIR" ]; then TARGET_DIR="."; fi
          cd "$TARGET_DIR"

          if [ -d "dist" ] && [ ! -d "www" ]; then cp -r dist www; fi

          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

          cd android
          # Gradle Wrapper'ı tam olarak istenen 8.7 sürümüne güncelle
          mkdir -p gradle/wrapper
          cat << 'EOF' > gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          # Sistem Gradle'ı ile wrapper scriptlerini oluştur
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      - name: APK Derle
        run: |
          TARGET_DIR=$(find . -maxdepth 2 -type d -name "dinlefix" | head -n 1)
          if [ -z "$TARGET_DIR" ]; then TARGET_DIR="."; fi
          cd "$TARGET_DIR/android"
          ./gradlew assembleDebug

      - name: APK Dosyasini Yukle
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/outputs/apk/debug/app-debug.apk'
          overwrite: true
          
