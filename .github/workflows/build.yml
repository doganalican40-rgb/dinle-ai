name: Dinle AI APK Oluştur

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - ana
      - master

permissions:
  contents: read

jobs:
  build:
    name: APK
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: ZIP Arşivlerini Çıkar
        shell: bash
        run: |
          if [ -f "DinleAI-NewLogo-VIP.zip" ]; then
            unzip -o DinleAI-NewLogo-VIP.zip -d .
          elif [ -f "DinleAI-Android-Fixed.zip" ]; then
            unzip -o DinleAI-Android-Fixed.zip -d .
          fi

      - name: Java 17 kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Node.js kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Proje klasörünü tespit et ve hazirla
        shell: bash
        run: |
          set -e
          P_DIR=$(find . -maxdepth 2 -type d -name "dinlefix" | head -n 1)
          if [ -z "$P_DIR" ]; then P_DIR="."; fi
          
          echo "PROJECT_DIR=$P_DIR" >> $GITHUB_ENV
          
          # .env olustur
          cat << EOF > "$P_DIR/.env"
          LIVEAVATAR_API_KEY=${{ secrets.LIVEAVATAR_API_KEY }}
          LIVEAVATAR_AVATAR_ID=${{ secrets.LIVEAVATAR_AVATAR_ID }}
          LIVEAVATAR_CONTEXT_ID=${{ secrets.LIVEAVATAR_CONTEXT_ID }}
          EOF

          # capacitor.config.json olustur
          rm -f "$P_DIR/capacitor.config.ts"
          cat << 'EOF' > "$P_DIR/capacitor.config.json"
          {
            "appId": "com.dinle.ai",
            "appName": "Dinle AI",
            "webDir": "dist"
          }
          EOF

      - name: Web Uygulamasını Derle
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          npm install --legacy-peer-deps
          npm install -D typescript || true
          npm run build

      - name: Capacitor Android Ekle ve Senkronize Et
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          if [ -d "dist" ] && [ ! -d "www" ]; then cp -r dist www; fi
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Android Ortamını ve Gradle Yapılandırmasını Hazırla
        shell: bash
        run: |
          A_DIR=""
          if [ -d "$PROJECT_DIR/android" ]; then
            A_DIR="$PROJECT_DIR/android"
          elif [ -d "android" ]; then
            A_DIR="android"
          fi
          
          echo "ANDROID_DIR=$A_DIR" >> $GITHUB_ENV
          cd "$A_DIR"

          # gradle.properties duzenle
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          # kotlin-fix scripti
          cat << 'EOF' > kotlin-fix.gradle
          allprojects {
              configurations.configureEach {
                  resolutionStrategy.eachDependency { details ->
                      if (details.requested.group == "org.jetbrains.kotlin") {
                          details.useVersion("1.8.22")
                      }
                  }
              }
          }
          EOF

          # Wrapper olustur
          gradle wrapper --gradle-version 8.7 || true
          chmod +x gradlew || true

      - name: APK Derle
        shell: bash
        run: |
          cd "$ANDROID_DIR"
          ./gradlew assembleDebug --init-script kotlin-fix.gradle --no-daemon -x test

      - name: APK Yükle
        uses: actions/upload-artifact@v4
        with:
          name: DinleAI-APK
          path: '**/outputs/apk/debug/*.apk'
          if-no-files-found: error
          
