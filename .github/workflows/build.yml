name: Build Android APK

on:
  push:
    branches: [ "main", "ana", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu Cek
        uses: actions/checkout@v4

      - name: ZIP Cikar
        run: |
          if [ -f "DinleAI-NewLogo-VIP.zip" ]; then
            unzip -o DinleAI-NewLogo-VIP.zip -d .
          elif [ -f "DinleAI-Android-Fixed.zip" ]; then
            unzip -o DinleAI-Android-Fixed.zip -d .
          fi

      - name: Node.js Kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ortam Degiskenlerini (.env) Olustur
        run: |
          TARGET_DIR=$(find . -maxdepth 2 -type d -name "dinlefix" | head -n 1)
          if [ -z "$TARGET_DIR" ]; then TARGET_DIR="."; fi
          cd "$TARGET_DIR"
          cat << EOF > .env
          LIVEAVATAR_API_KEY=${{ secrets.LIVEAVATAR_API_KEY }}
          LIVEAVATAR_AVATAR_ID=${{ secrets.LIVEAVATAR_AVATAR_ID }}
          LIVEAVATAR_CONTEXT_ID=${{ secrets.LIVEAVATAR_CONTEXT_ID }}
          EOF

      - name: Bagimliliklari Yukle
        run: |
          TARGET_DIR=$(find . -maxdepth 2 -type d -name "dinlefix" | head -n 1)
          if [ -z "$TARGET_DIR" ]; then TARGET_DIR="."; fi
          cd "$TARGET_DIR"
          npm install --legacy-peer-deps
          npm install -D typescript || true

      - name: Web Uygulamasini Derle
        run: |
          TARGET_DIR=$(find . -maxdepth 2 -type d -name "dinlefix" | head -n 1)
          if [ -z "$TARGET_DIR" ]; then TARGET_DIR="."; fi
          cd "$TARGET_DIR"
          
          rm -f capacitor.config.ts
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.dinle.ai",
            "appName": "Dinle AI",
            "webDir": "dist"
          }
          EOF
          
          npm run build

      - name: Java 21 Kur (En Guncel AGP Uyumlu)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Gradle Sistem Kurulumu
        uses: gradle/actions/setup-gradle@v3

      - name: Android Klasorunu Hazirla, Wrapper Olustur ve APK Derle
        run: |
          TARGET_DIR=$(find . -maxdepth 2 -type d -name "dinlefix" | head -n 1)
          if [ -z "$TARGET_DIR" ]; then TARGET_DIR="."; fi
          cd "$TARGET_DIR"

          if [ -d "dist" ] && [ ! -d "www" ]; then cp -r dist www; fi

          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

          cd android
          
          # Gradle konfigürasyonunu ayarla
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          # Eksik gradlew dosyasini doğrudan üret
          gradle wrapper
          chmod +x gradlew
          
          # Derlemeyi başlat
          ./gradlew assembleDebug -x test --warning-mode none

      - name: APK Dosyasini Yukle
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/outputs/apk/debug/app-debug.apk'
          overwrite: true
          
