name: Build Dinle AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - ana

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-ci

    steps:

      # ==========================================
      # 1. REPOYU CEK
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================
      # 2. ZIP DOSYASINI BUL VE CIKAR
      # ==========================================
      - name: ZIP dosyasini cikar
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "REPO ICERIGI"
          echo "======================================"

          ls -lah

          ZIP_FILE=""

          if [ -f "DinleAI-Android-Fixed-APK-Ready.zip" ]; then
            ZIP_FILE="DinleAI-Android-Fixed-APK-Ready.zip"

          elif [ -f "DinleAI-Android-Fixed.zip" ]; then
            ZIP_FILE="DinleAI-Android-Fixed.zip"

          elif [ -f "DinleAI-NewLogo-VIP.zip" ]; then
            ZIP_FILE="DinleAI-NewLogo-VIP.zip"

          else
            ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "HATA: ZIP dosyasi bulunamadi!"
            exit 1
          fi

          echo "Bulunan ZIP: $ZIP_FILE"

          mkdir -p extracted

          unzip -o "$ZIP_FILE" -d extracted

          echo "======================================"
          echo "ZIP CIKARILDI"
          echo "======================================"

          find extracted -maxdepth 3 -type f | head -100


      # ==========================================
      # 3. PROJE KLASORUNU BUL
      # ==========================================
      - name: Proje klasorunu bul
        shell: bash
        run: |
          set -e

          echo "package.json araniyor..."

          PROJECT_DIR=$(find extracted \
            -type f \
            -name "package.json" \
            -not -path "*/node_modules/*" \
            -exec dirname {} \; | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "HATA: ZIP icinde package.json bulunamadi!"

            echo "ZIP icerigi:"
            find extracted -maxdepth 5 -type f | head -200

            exit 1
          fi

          echo "======================================"
          echo "PROJE BULUNDU"
          echo "======================================"

          echo "PROJECT_DIR=$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ==========================================
      # 4. JAVA 17
      # ==========================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ==========================================
      # 5. NODE 20
      # ==========================================
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'


      # ==========================================
      # 6. GRADLE 8.9
      # ==========================================
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'


      # ==========================================
      # 7. NODE BAGIMLILIKLARI
      # ==========================================
      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "Node:"
          node --version

          echo "NPM:"
          npm --version

          if [ -f package-lock.json ]; then
            echo "package-lock.json bulundu."

            npm ci \
              --legacy-peer-deps \
              --no-audit \
              --no-fund

          else
            echo "package-lock.json bulunamadi."

            npm install \
              --legacy-peer-deps \
              --no-audit \
              --no-fund
          fi


      # ==========================================
      # 8. WEB UYGULAMASINI DERLE
      # ==========================================
      - name: Build web app
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "WEB BUILD"
          echo "======================================"

          npm run build

          if [ ! -d "dist" ]; then
            echo "HATA: dist klasoru olusmadi!"
            exit 1
          fi

          echo "Web build basarili."


      # ==========================================
      # 9. ANDROID ASSETS
      # ==========================================
      - name: Android web assets hazirla
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          if [ -f "scripts/sync-android-assets.mjs" ]; then

            echo "Android asset scripti bulundu."

            node scripts/sync-android-assets.mjs

          else

            echo "sync scripti bulunamadi."

            if [ -d "android/app/src/main/assets/public" ]; then

              rm -rf android/app/src/main/assets/public

            fi

            mkdir -p android/app/src/main/assets/public

            cp -r dist/. android/app/src/main/assets/public/

          fi

          echo "Android web assets hazir."


      # ==========================================
      # 10. GRADLE PROPERTIES
      # ==========================================
      - name: Gradle ayarlarini yapilandir
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          set -e

          cat > gradle.properties << 'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          org.gradle.daemon=false
          org.gradle.parallel=false
          org.gradle.caching=false
          EOF

          echo "Gradle ayarlari:"
          cat gradle.properties


      # ==========================================
      # 11. GRADLE WRAPPER
      # ==========================================
      - name: Gradle wrapper kontrolu
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          set -e

          if [ ! -f "./gradlew" ]; then

            echo "gradlew bulunamadi."

            gradle wrapper \
              --gradle-version 8.9

          fi

          chmod +x gradlew

          echo "Gradle:"
          ./gradlew --version


      # ==========================================
      # 12. ANDROID APK DERLE
      # ==========================================
      - name: Android APK Derle
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "DINLE AI APK DERLEME"
          echo "======================================"

          ./gradlew clean :app:assembleDebug \
            --no-daemon \
            --no-parallel \
            --stacktrace \
            --warning-mode all

          echo "APK DERLEME TAMAMLANDI."


      # ==========================================
      # 13. APK KONTROL
      # ==========================================
      - name: APK kontrol
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "HATA: APK olusturulamadi."
            exit 1
          fi

          echo "======================================"
          echo "APK BASARILI"
          echo "======================================"

          ls -lh "$APK"


      # ==========================================
      # 14. APK YUKLE
      # ==========================================
      - name: APK yukle
        uses: actions/upload-artifact@v4
        with:
          name: DinleAI-debug-APK
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          overwrite: true
