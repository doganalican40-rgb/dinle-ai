name: Build Dinle AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - ana

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-ci

    steps:

      # ==========================================
      # 1. REPO
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================
      # 2. PROJE KLASORUNU BUL
      # ==========================================
      - name: Proje klasorunu bul
        shell: bash
        run: |
          set -e

          if [ -f "package.json" ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"

          elif [ -f "dinlefix/package.json" ]; then
            echo "PROJECT_DIR=dinlefix" >> "$GITHUB_ENV"

          else
            echo "HATA: package.json bulunamadi."

            find . \
              -maxdepth 4 \
              -name package.json \
              -print

            exit 1
          fi


      # ==========================================
      # 3. JAVA 17
      # ==========================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ==========================================
      # 4. NODE 20
      # ==========================================
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'


      # ==========================================
      # 5. GRADLE 8.9
      # ==========================================
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'


      # ==========================================
      # 6. NODE BAGIMLILIKLARI
      # ==========================================
      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "Node:"
          node --version

          echo "NPM:"
          npm --version

          if [ -f package-lock.json ]; then
            echo "package-lock.json bulundu."

            npm ci \
              --legacy-peer-deps \
              --no-audit \
              --no-fund

          else
            echo "package-lock.json bulunamadi."

            npm install \
              --legacy-peer-deps \
              --no-audit \
              --no-fund
          fi


      # ==========================================
      # 7. WEB UYGULAMASINI DERLE
      # ==========================================
      - name: Build web app
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_BACKEND_BASE_URL: ${{ vars.VITE_BACKEND_BASE_URL }}
        shell: bash
        run: |
          set -e

          echo "Web uygulamasi derleniyor..."

          npm run build

          echo "Build tamamlandi."

          if [ ! -d "dist" ]; then
            echo "HATA: dist klasoru olusmadi."
            exit 1
          fi


      # ==========================================
      # 8. WEB DOSYALARINI ANDROID'E AKTAR
      # ==========================================
      - name: Sync web assets into Android
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "Android assets guncelleniyor..."

          node scripts/sync-android-assets.mjs

          if [ ! -f "android/app/src/main/assets/public/index.html" ]; then
            echo "HATA: Android web assets bulunamadi."
            exit 1
          fi

          echo "Android web assets hazir."


      # ==========================================
      # 9. GRADLE WRAPPER
      # ==========================================
      - name: Prepare Gradle wrapper
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          set -e

          if [ ! -f "./gradlew" ]; then

            echo "gradlew bulunamadi."
            echo "Gradle 8.9 wrapper olusturuluyor..."

            gradle wrapper \
              --gradle-version 8.9

          else

            echo "Mevcut gradlew kullaniliyor."

          fi

          chmod +x gradlew

          echo "Gradle versiyonu:"
          ./gradlew --version


      # ==========================================
      # 10. ANDROID APK DERLE
      # ==========================================
      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "DINLE AI ANDROID APK"
          echo "======================================"

          ./gradlew clean :app:assembleDebug \
            --no-daemon \
            --no-parallel \
            --stacktrace \
            --warning-mode all

          echo "======================================"
          echo "APK DERLEME TAMAMLANDI"
          echo "======================================"


      # ==========================================
      # 11. APK KONTROL
      # ==========================================
      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "HATA: APK olusturulamadi."
            exit 1
          fi

          echo "APK BASARIYLA OLUSTU:"
          ls -lh "$APK"


      # ==========================================
      # 12. APK'YI GITHUB'A YUKLE
      # ==========================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DinleAI-debug-apk
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          overwrite: true
